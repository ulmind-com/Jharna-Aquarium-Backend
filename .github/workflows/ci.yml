name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install & boot-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Import / app boot check
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB: ci_check
          JWT_SECRET: ci-secret
        run: |
          uv run python -c "import app.main; print('FastAPI app imported OK:', app.main.app.title)"

      - name: Lint (compile check)
        run: uv run python -m compileall app
